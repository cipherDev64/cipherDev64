<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 206" width="420" height="206" role="img" aria-label="Windecor Interiors: a film-led website for an interior studio: homes, cafés and boutiques."><defs><clipPath id="cl"><rect x="1" y="1" width="418" height="204" rx="18"/></clipPath><linearGradient id="shg" x1="0" x2="1"><stop offset="0" stop-color="#f3eee7" stop-opacity="0"/><stop offset=".5" stop-color="#f3eee7" stop-opacity=".06"/><stop offset="1" stop-color="#f3eee7" stop-opacity="0"/></linearGradient></defs><style>
.bob{animation:bob 3.4s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(3);opacity:0}}
.sheen{animation:sheen 9s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(-160px) skewX(-18deg)}22%,100%{transform:translateX(580px) skewX(-18deg)}}
.nudge{animation:nudge 1.8s ease-in-out infinite alternate}
@keyframes nudge{from{transform:translateX(0)}to{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="1" y="1" width="418" height="204" rx="18" fill="#161412"/><rect x="1.5" y="1.5" width="417" height="203" rx="17.5" fill="none" stroke="#2b2723"/><g clip-path="url(#cl)"><rect class="sheen" style="animation-delay:2.6s" x="0" y="0" width="70" height="206" fill="url(#shg)"/></g><g class="bob" style="animation-delay:-2.6s"><rect x="24" y="24" width="44" height="44" rx="12" fill="#4a4d5c" stroke="#f3eee7" stroke-opacity=".12"/><text x="46" y="53.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#f3eee7" text-anchor="middle" >W</text></g><text x="84" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#f3eee7" text-anchor="start" letter-spacing="-.3">Windecor Interiors</text><circle class="pulse" style="animation-delay:-2.6s" cx="89" cy="61" r="3.5" fill="#4ade80"/><circle cx="89" cy="61" r="3.5" fill="#4ade80"/><text x="99" y="65.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#a1978d" text-anchor="start" >live</text><text x="24" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#d9d2c9" text-anchor="start" >a film-led website for an interior studio:</text><text x="24" y="125" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#d9d2c9" text-anchor="start" >homes, cafés and boutiques.</text><rect x="24.0" y="152" width="91" height="24" rx="12" fill="#1d1a17" stroke="#2b2723"/><text x="69.5" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#a1978d" text-anchor="middle" >TypeScript</text><rect x="121.0" y="152" width="56" height="24" rx="12" fill="#1d1a17" stroke="#2b2723"/><text x="149.25" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#a1978d" text-anchor="middle" >Video</text><rect x="183.5" y="152" width="91" height="24" rx="12" fill="#1d1a17" stroke="#2b2723"/><text x="229.0" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#a1978d" text-anchor="middle" >Web design</text><g class="nudge" style="animation-delay:-2.6s"><text x="396" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ef6a3a" text-anchor="end" >view case →</text></g></svg>