"600" fill="#a1978d" text-anchor="middle" >React</text><rect x="86.5" y="152" width="50" height="24" rx="12" fill="#1d1a17" stroke="#2b2723"/><text x="111.3" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#a1978d" text-anchor="middle" >Vite</text><rect x="142.1" y="152" width="91" height="24" rx="12" fill="#1d1a17" stroke="#2b2723"/><text x="187.6" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#a1978d" text-anchor="middle" >TypeScript</text><g class="nudge" style="animation-delay:-0.0s"><text x="396" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ef6a3a" text-anchor="end" >view case →</text></g></svg>