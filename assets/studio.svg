<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img" aria-label="Second Algorithm: an independent creative technology studio in Bengaluru. Design you'll notice. Systems you won't."><defs><clipPath id="cl"><rect x="1" y="1" width="958" height="370" rx="18"/></clipPath><linearGradient id="shg" x1="0" x2="1"><stop offset="0" stop-color="#ef6a3a" stop-opacity="0"/><stop offset=".5" stop-color="#ef6a3a" stop-opacity=".08"/><stop offset="1" stop-color="#ef6a3a" stop-opacity="0"/></linearGradient></defs><style>
.run{animation:run 8s cubic-bezier(.6,0,.3,1) infinite}
@keyframes run{0%,6%{transform:translateX(0)}25%,31%{transform:translateX(264px)}50%,56%{transform:translateX(528px)}75%,94%{transform:translateX(792px)}100%{transform:translateX(0)}}
