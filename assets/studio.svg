idth="1.5"/><circle class="s0" cx="72" cy="244" r="6" fill="#ef6a3a"/><text x="48" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f3eee7" text-anchor="start" >01  Listen</text><text x="48" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6a625b" text-anchor="start" >a call, lots of questions</text><circle cx="336" cy="244" r="11" fill="#161412" stroke="#2b2723" stroke-width="1.5"/><circle class="s1" cx="336" cy="244" r="6" fill="#ef6a3a"/><text x="336" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f3eee7" text-anchor="middle" >02  Sketch</text><text x="336" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6a625b" text-anchor="middle" >real options, not one guess</text><circle cx="600" cy="244" r="11" fill="#161412" stroke="#2b2723" stroke-width="1.5"/><circle class="s2" cx="600" cy="244" r="6" fill="#ef6a3a"/><text x="600" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f3eee7" text-anchor="middle" >03  Build</text><text x="600" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6a625b" text-anchor="middle" >design + code, side by side</text><circle cx="864" cy="244" r="11" fill="#161412" stroke="#2b2723" stroke-width="1.5"/><circle class="s3" cx="864" cy="244" r="6" fill="#ef6a3a"/><text x="888" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f3eee7" text-anchor="end" >04  Launch</text><text x="888" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6a625b" text-anchor="end" >docs, walkthrough, the keys</text><g class="run"><circle cx="72" cy="244" r="16" fill="#ef6a3a" fill-opacity=".18"/></g><rect x="48" y="330" width="128" height="24" rx="12" fill="#1d1a17" stroke="#2b2723"/><text x="112.19999999999999" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#a1978d" text-anchor="middle" >Web engineering</text><rect x="184.39999999999998" y="330" width="59" height="24" rx="12" fill="#1d1a17" stroke="#2b2723"/><text x="213.79999999999998" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#a1978d" text-anchor="middle" >UI/UX</text><rect x="251.2" y="330" width="73" height="24" rx="12" fill="#1d1a17" stroke="#2b2723"/><text x="287.56" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#a1978d" text-anchor="middle" >AI &amp; ML</text><rect x="331.91999999999996" y="330" width="80" height="24" rx="12" fill="#1d1a17" stroke="#2b2723"/><text x="371.75999999999993" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#a1978d" text-anchor="middle" >Branding</text><rect x="419.59999999999997" y="330" width="94" height="24" rx="12" fill="#1d1a17" stroke="#2b2723"/><text x="466.4" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#a1978d" text-anchor="middle" >Automation</text><rect x="521.1999999999999" y="330" width="66" height="24" rx="12" fill="#1d1a17" stroke="#2b2723"/><text x="554.0799999999999" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#a1978d" text-anchor="middle" >Growth</text><text x="912" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#6a625b" text-anchor="end" >honest timelines · code you own</text></svg>